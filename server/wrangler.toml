name = "redflag"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The whole site is served from the repository root. .assetsignore there
# keeps the server code, tests and scripts from being published.
[assets]
directory = "../"
binding = "ASSETS"

# Cloudflare Workers AI. On the Workers Free plan it is free up to a daily
# allowance and then stops working until midnight UTC; it never bills.
[ai]
binding = "AI"

[vars]
# "workers-ai" (free) or "claude" (paid, needs the ANTHROPIC_API_KEY secret).
AI_PROVIDER = "workers-ai"
# Leave empty for the default model of the chosen provider.
MODEL = ""
# Other sites allowed to call /api/check, comma separated. The site's own
# pages are always allowed.
ALLOWED_ORIGINS = "https://redflag-sable.vercel.app,https://fojikulul.github.io,http://localhost:8080,http://127.0.0.1:8080"
# Model for the phone number web search. Leave empty for the default.
GEMINI_MODEL = ""
# FTC pages (50 reports each) imported per scheduled run.
FTC_PAGES_PER_RUN = "10"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Three phone lookups a minute per visitor.
[[ratelimits]]
name = "LOOKUP_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

# Usage counts (one row per day and verdict, with a number) and a copy of
# the public FTC reports for the phone lookup. No message text, no numbers
# people looked up, no addresses, nothing about who checked. Schema in
# schema.sql.
[[d1_databases]]
binding = "DB"
database_name = "redflag-stats"
database_id = "b322396f-a62b-44d2-9fd3-96d40aef7871"

# Every 20 minutes, import the next batch of FTC reports.
[triggers]
crons = ["*/20 * * * *"]
