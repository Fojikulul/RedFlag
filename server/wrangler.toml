name = "redflag-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Pages allowed to call this Worker, comma separated.
ALLOWED_ORIGINS = "https://fojikulul.github.io,http://localhost:8080,http://127.0.0.1:8080"
# Leave empty for the default model. claude-haiku-5-5 is much cheaper.
MODEL = ""

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
